<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>星噬 · 黑洞吞噬</title>
  <meta name="description" content="引力牵引黑洞，吞噬天体成长，与 AI 黑洞竞逐的物理养成游戏" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B3%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <div id="stage">
      <canvas id="game" width="960" height="640"></canvas>

      <!-- 计时条 -->
      <div id="timerWrap"><div id="timerBar"></div></div>

      <!-- 顶部 HUD -->
      <div id="hud">
        <div class="hud-group">
          <a class="back-chip" id="backLink" href="../../index.html">← 大厅</a>
          <div class="stat">
            <span class="label">质量 MASS</span>
            <span class="value" id="mass">0</span>
          </div>
        </div>
        <div class="hud-group">
          <div class="chip" id="rank">-</div>
        </div>
        <div class="hud-group">
          <div class="stat" style="text-align:right">
            <span class="label">最佳 BEST</span>
            <span class="value" id="best">0</span>
          </div>
          <button class="icon-btn" id="muteBtn" title="声音开关" aria-label="声音开关">🔊</button>
          <button class="icon-btn" id="pauseBtn" title="暂停" aria-label="暂停">⏸</button>
        </div>
      </div>

      <!-- 主菜单 -->
      <div class="overlay" id="menu">
        <h1 class="title">星噬</h1>
        <p class="subtitle">Singularity · 引力黑洞</p>
        <p class="menu-best">最佳质量 <b id="menuBest">0</b></p>
        <button class="btn" id="startBtn">开 始 吞 噬</button>
        <div class="hint">
          <span>🖱️ 按住拖拽 = 引力牵引</span>
          <span>⭐ 吞噬小的天体成长</span>
          <span>💀 避开更大的天体</span>
        </div>
      </div>

      <!-- 暂停 -->
      <div class="overlay hidden" id="pause">
        <h2 class="title" style="font-size:clamp(1.6rem,5vw,2.6rem)">已暂停</h2>
        <button class="btn" id="resumeBtn">继 续 游 戏</button>
      </div>

      <!-- 结算 -->
      <div class="overlay hidden" id="over">
        <h2 class="title" id="overTitle" style="font-size:clamp(1.6rem,5vw,2.6rem)">游戏结束</h2>
        <div class="final-score" id="finalMass">0</div>
        <div class="rank-line" id="overRank">第 4 名</div>
        <div class="badge hidden" id="newRecord">✦ 新纪录 ✦</div>
        <p class="menu-best">最佳质量 <b id="overBest">0</b></p>
        <button class="btn" id="restartBtn">再 来 一 局</button>
        <button class="btn ghost" id="menuBtn">主 菜 单</button>
        <div class="hint"><span>按 <kbd>空格</kbd> 或 <kbd>Enter</kbd> 重新开始</span></div>
      </div>

      <div id="toast" class="hidden"></div>
    </div>
    <footer>星噬 · 黑洞吞噬 — 在星海中吞噬，成为唯一的奇点</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
