<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>星流节拍 · 音浪共振</title>
  <meta name="description" content="WebAudio 实时合成音游：跟随节拍点击放射轨道上的音符" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <div id="stage">
      <canvas id="game" width="960" height="640"></canvas>

      <!-- 顶部 HUD -->
      <div id="hud">
        <div class="hud-group">
          <a class="back-chip" id="backLink" href="../../index.html">← 大厅</a>
          <div class="stat">
            <span class="label">分数 SCORE</span>
            <span class="value" id="score">0</span>
          </div>
        </div>
        <div class="hud-group">
          <div class="chip" id="combo">连击 -</div>
          <div class="chip" id="life">♥♥♥♥♥</div>
        </div>
        <div class="hud-group">
          <div class="stat" style="text-align:right">
            <span class="label">最佳 BEST</span>
            <span class="value" id="best">0</span>
          </div>
          <button class="icon-btn" id="muteBtn" title="声音开关" aria-label="声音开关">🔊</button>
          <button class="icon-btn" id="pauseBtn" title="暂停" aria-label="暂停">⏸</button>
        </div>
      </div>

      <!-- 主菜单 -->
      <div class="overlay" id="menu">
        <h1 class="title">星流节拍</h1>
        <p class="subtitle">Pulse Star · 合成音游</p>
        <p class="menu-best">最高分 <b id="menuBest">0</b></p>
        <button class="btn" id="startBtn">开 始 演 奏</button>
        <div class="hint">
          <span>音符落到光环时按下对应键</span>
          <span><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd> = 四条轨道（触屏分四区点击）</span>
          <span>Perfect 攒满能量 → 极光爆发 ×2</span>
        </div>
      </div>

      <!-- 暂停 -->
      <div class="overlay hidden" id="pause">
        <h2 class="title" style="font-size:clamp(1.6rem,5vw,2.6rem)">节拍暂歇</h2>
        <button class="btn" id="resumeBtn">继 续 演 奏</button>
      </div>

      <!-- 结算 -->
      <div class="overlay hidden" id="over">
        <h2 class="title" id="overTitle" style="font-size:clamp(1.6rem,5vw,2.6rem)">星流紊乱</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="badge hidden" id="newRecord">✦ 新纪录 ✦</div>
        <p class="menu-best">最高分 <b id="overBest">0</b></p>
        <button class="btn" id="restartBtn">再 来 一 局</button>
        <button class="btn ghost" id="menuBtn">主 菜 单</button>
        <div class="hint"><span>按 <kbd>空格</kbd> 或 <kbd>Enter</kbd> 重新开始</span></div>
      </div>

      <div id="toast" class="hidden"></div>
    </div>
    <footer>星流节拍 · 音浪共振 — 让指尖跟上星河的脉搏</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
