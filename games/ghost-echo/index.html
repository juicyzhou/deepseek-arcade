<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>双身迷宫 · 时间幽灵</title>
  <meta name="description" content="回声延迟解谜：你的过去身以 2.6 秒延迟复刻你的每一步，与它配合破解迷宫" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <div id="stage">
      <canvas id="game" width="960" height="640"></canvas>

      <!-- 顶部 HUD -->
      <div id="hud">
        <div class="hud-group">
          <a class="back-chip" id="backLink" href="../../index.html">← 大厅</a>
          <div class="stat">
            <span class="label">关卡</span>
            <span class="value" id="level">1</span>
          </div>
        </div>
        <div class="hud-group">
          <div class="chip" id="phase">● 进行中</div>
          <div class="chip" id="gems">✦ 0</div>
        </div>
        <div class="hud-group">
          <div class="stat" style="text-align:right">
            <span class="label">最佳 BEST</span>
            <span class="value" id="best">0</span>
          </div>
          <button class="icon-btn" id="muteBtn" title="声音开关" aria-label="声音开关">🔊</button>
          <button class="icon-btn" id="pauseBtn" title="暂停" aria-label="暂停">⏸</button>
        </div>
      </div>

      <!-- 主菜单 -->
      <div class="overlay" id="menu">
        <h1 class="title glitch" data-text="双身迷宫">双身迷宫</h1>
        <p class="subtitle">Ghost Echo · 与过去身共舞</p>
        <p class="menu-best">最高分 <b id="menuBest">0</b></p>
        <button class="btn" id="startBtn">进 入 迷 宫</button>
        <div class="hint">
          <span>👻 你的过去身以 2.6 秒延迟复刻你的每一步</span>
          <span>⚡ 让它踩住压力板，你穿过闸门</span>
          <span>🧊 幽灵免疫激光，你不行</span>
        </div>
      </div>

      <!-- 暂停 -->
      <div class="overlay hidden" id="pause">
        <h2 class="title" style="font-size:clamp(1.6rem,5vw,2.6rem)">时间冻结</h2>
        <button class="btn" id="resumeBtn">继 续 解 谜</button>
      </div>

      <!-- 结算 -->
      <div class="overlay hidden" id="over">
        <h2 class="title" id="overTitle" style="font-size:clamp(1.6rem,5vw,2.6rem)">信号丢失</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="badge hidden" id="newRecord">✦ 新纪录 ✦</div>
        <p class="menu-best">最高分 <b id="overBest">0</b></p>
        <button class="btn" id="restartBtn">重 试 本 关</button>
        <button class="btn ghost" id="menuBtn">主 菜 单</button>
        <div class="hint"><span>按 <kbd>空格</kbd> 重试本关</span></div>
      </div>

      <div id="toast" class="hidden"></div>
    </div>
    <footer>双身迷宫 · 时间幽灵 — 你走过的路，会有人替你重走一遍</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
